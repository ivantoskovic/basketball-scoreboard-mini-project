<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div>
        <h3 class="team">HOME</h3>
        <div class="score" id="home-score">0</div>
        <div class="btn-container">
          <button class="btn" onclick="addOnePointHome()">+1</button>
          <button class="btn" onclick="addTwoPointsHome()">+2</button>
          <button class="btn" onclick="addThreePointsHome()">+3</button>
        </div>
      </div>
      <div>
        <h3 class="team">AWAY</h3>
        <div class="score" id="guest-score">0</div>
        <div class="btn-container">
          <button class="btn" onclick="addOnePointGuest()">+1</button>
          <button class="btn" onclick="addTwoPointsGuest()">+2</button>
          <button class="btn" onclick="addThreePointsGuest()">+3</button>
        </div>
      </div>
    </div>
    <div class="btn-newgame">
      <button class="btn" onclick="reset()">New Game</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
